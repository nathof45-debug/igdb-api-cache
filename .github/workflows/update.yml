name: Generate IGDB BFF

# QUAND LANCER LE WORKFLOW ?
on:
  schedule:
    - cron: '17 0 * * *'   # Automatiquement tous les jours à 2h17 (heure FR)
    - cron: '17 14 * * *'  # 14:17 (heure FR)
  workflow_dispatch:      # Permet le lancement manuel
  push:
    branches:
      - main              # Déclenchement sur push sur la branche main

# PERMISSIONS REQUISES
permissions:
  contents: write         # Indispensable pour publier sur la branche gh-pages

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Mis à jour de @v3 vers @v4 (support Node 24)
      - uses: actions/checkout@v4
      
      # 2. Mis à jour de @v4 vers @v5 (support Node 24)
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          
      - name: Install dependencies
        run: pip install requests
        
      - name: Run BFF script
        env:
          TWITCH_CLIENT_ID: ${{ secrets.TWITCH_CLIENT_ID }}
          TWITCH_CLIENT_SECRET: ${{ secrets.TWITCH_CLIENT_SECRET }}
        run: python main.py

      # 3. Mis à jour de @v3 vers @v4
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
